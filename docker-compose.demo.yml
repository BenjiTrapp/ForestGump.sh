services:
  rdp-target:
    build: ./deploy/rdp-target
    container_name: rdp-target
    ports:
      - "3389:3389"
    networks:
      - adlab

  forestgump:
    build: .
    container_name: forestgump
    ports:
      - "7681:7681"
    networks:
      - adlab
    depends_on:
      - rdp-target

networks:
  adlab:
    driver: bridge
